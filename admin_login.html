<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <div class="box">

        <h1>🛡️ Admin Login</h1>

        <form action="/admin/login" method="post">

            <input
                type="text"
                name="username"
                placeholder="Admin Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Admin Password"
                required
            >

            <button type="submit">
                Admin Login
            </button>

        </form>

        <br>

        <a href="/">
            Back to Home
        </a>

    </div>

</body>

</html>
